name: Selenium Test Suite

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]          # also run on merges to main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run smoke tests first (fast gate)
        run: pytest -m smoke --html=reports/smoke.html --self-contained-html

      - name: Run full test suite
        run: pytest --html=reports/full.html --self-contained-html

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always()           # upload even if tests fail — so you can see what broke
        with:
          name: test-reports
          path: reports/
